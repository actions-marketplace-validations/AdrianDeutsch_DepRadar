name: publish

# Publishes the depradar CLI to NuGet.org. Push a tag like `v0.2.0` to release that
# version, or run manually to produce a dev package. The push step is a no-op until the
# NUGET_API_KEY secret is set, so the workflow is safe to land before publishing.

on:
  push:
    tags: ["v*.*.*"] # full semver tags only (the moving v1 major tag must not publish)
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release and upload the standalone binaries
  packages: write # publish to GitHub Packages with the built-in token
  id-token: write # keyless SLSA provenance via GitHub's OIDC token
  attestations: write # record the build-provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Pack the depradar tool
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "Packing DepRadar.Tool $VERSION"
          dotnet pack src/DepRadar.Cli/DepRadar.Cli.csproj -c Release -o ./artifacts/nupkg -p:Version="$VERSION"

      # Keyless SLSA build provenance (Sigstore via GitHub OIDC — no signing cert needed).
      # Verify a downloaded package with: gh attestation verify <file>.nupkg -R AdrianDeutsch/DepRadar
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "./artifacts/nupkg/*.nupkg"

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./artifacts/nupkg/*.nupkg \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY not set — skipping NuGet.org push (GitHub Packages done)."
            exit 0
          fi
          dotnet nuget push ./artifacts/nupkg/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload the package as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/nupkg/*.nupkg

      # Standalone binaries: the npm/PyPI/Cargo/Go audience has no .NET SDK, so every
      # release ships self-contained single-file builds. Asset names are UNVERSIONED on
      # purpose — that keeps `releases/latest/download/...` URLs stable.
      - name: Publish standalone binaries
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts/dist
          for RID in linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64; do
            echo "::group::publish $RID"
            dotnet publish src/DepRadar.Cli/DepRadar.Cli.csproj -c Release -r "$RID" \
              -p:StandaloneBinary=true -p:Version="$VERSION" \
              -o "artifacts/bin/$RID"
            if [ "$RID" = "win-x64" ]; then
              (cd "artifacts/bin/$RID" && zip -q "../../dist/depradar-$RID.zip" depradar.exe)
            else
              tar -czf "artifacts/dist/depradar-$RID.tar.gz" -C "artifacts/bin/$RID" depradar
            fi
            echo "::endgroup::"
          done
          (cd artifacts/dist && shasum -a 256 depradar-* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Attest binary provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "./artifacts/dist/depradar-*"

      # The workflow owns the release now: create it if the tag has none, then attach
      # the binaries. Notes are edited afterwards (gh release edit) without re-upload.
      - name: Create the release and upload binaries
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "DepRadar $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" artifacts/dist/* --repo "$GITHUB_REPOSITORY" --clobber
